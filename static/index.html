<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArgenFlow V4 Pro | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1117;
            --card-bg: #1a1d26;
            --accent-gold: #ffd700;
            --accent-blue: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: linear-gradient(to bottom, #1e293b, var(--bg-dark));
            border-bottom: 1px solid #334155;
        }

        h1 {
            margin: 0;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .full-width { grid-column: 1 / -1; }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            margin: 10px 0;
            font-family: 'JetBrains Mono', monospace;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-off { background: #334155; color: white; }
        .status-on { background: var(--success); color: white; }
        .status-sniper { background: var(--accent-gold); color: black; }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        #btnMain { background: var(--accent-blue); color: white; }
        #btnMain.active { background: var(--danger); }

        #btnSniper { background: #374151; color: var(--accent-gold); border: 2px solid var(--accent-gold); }
        #btnSniper.active { background: var(--accent-gold); color: black; }

        button:hover { transform: translateY(-2px); opacity: 0.9; }

        #console {
            background: #000;
            height: 300px;
            border-radius: 8px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            overflow-y: auto;
            border: 1px solid #334155;
            line-height: 1.5;
        }

        .log-entry { margin-bottom: 5px; border-left: 3px solid #334155; padding-left: 10px; }
        .log-sniper { border-color: var(--accent-gold); color: var(--accent-gold); }
        .log-error { border-color: var(--danger); color: var(--danger); }
        .log-success { border-color: var(--success); color: var(--success); }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>ArgenFlow V4 <span style="color:white">PRO</span></h1>
        <p style="color: var(--text-dim); margin-top: 5px;">Sistema Quant de Alta Frecuencia</p>
    </header>

    <div class="container">
        <div class="card">
            <h3 style="color: var(--text-dim); margin: 0;">Balance Total (USD)</h3>
            <div id="balanceValue" class="stat-value">$0.00</div>
            <div>
                Estado: <span id="mainStatusBadge" class="status-badge status-off">Inactivo</span>
                <span id="sniperStatusBadge" class="status-badge status-off" style="display: none;">SNIPER</span>
            </div>
        </div>

        <div class="card">
            <h3 style="color: var(--text-dim); margin-bottom: 15px;">Panel de Control</h3>
            <div class="controls">
                <button id="btnMain" onclick="toggleBot()">Iniciar Robot Principal</button>
                <button id="btnSniper" onclick="toggleSniper()">🎯 Modo Sniper Oro (HFT)</button>
            </div>
        </div>

        <div class="card full-width">
            <h3 style="color: var(--text-dim); margin-bottom: 10px;">Monitor de Actividad en Tiempo Real</h3>
            <div id="console">
                <div class="log-entry">Esperando conexión con el servidor...</div>
            </div>
        </div>
    </div>

    <script>
        let botActive = false;
        let sniperActive = false;

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                // Actualizar Balance
                document.getElementById('balanceValue').innerText = `$${data.balance.toFixed(2)}`;

                // Actualizar Badges
                const mainBadge = document.getElementById('mainStatusBadge');
                const sniperBadge = document.getElementById('sniperStatusBadge');

                if (data.active) {
                    mainBadge.innerText = "Operando";
                    mainBadge.className = "status-badge status-on";
                } else {
                    mainBadge.innerText = "Inactivo";
                    mainBadge.className = "status-badge status-off";
                }

                if (data.sniper) {
                    sniperBadge.style.display = "inline-block";
                    sniperBadge.className = "status-badge status-sniper";
                } else {
                    sniperBadge.style.display = "none";
                }

                // Procesar Logs
                if (data.new_logs && data.new_logs.length > 0) {
                    const consoleDiv = document.getElementById('console');
                    data.new_logs.forEach(log => {
                        const entry = document.createElement('div');
                        entry.className = 'log-entry';
                        
                        if (log.includes('⚡ SNIPER')) entry.classList.add('log-sniper');
                        if (log.includes('🔥')) entry.classList.add('log-success');
                        if (log.includes('❌')) entry.classList.add('log-error');
                        
                        const time = new Date().toLocaleTimeString();
                        entry.innerHTML = `<span style="color: #64748b;">[${time}]</span> ${log}`;
                        consoleDiv.appendChild(entry);
                    });
                    consoleDiv.scrollTop = consoleDiv.scrollHeight;
                }
            } catch (e) {
                console.error("Error actualizando status", e);
            }
        }

        async function toggleBot() {
            botActive = !botActive;
            const res = await fetch(`/api/toggle?active=${botActive}`);
            const data = await res.json();
            
            const btn = document.getElementById('btnMain');
            if (botActive) {
                btn.innerText = "Detener Robot";
                btn.classList.add('active');
            } else {
                btn.innerText = "Iniciar Robot Principal";
                btn.classList.remove('active');
            }
        }

        async function toggleSniper() {
            sniperActive = !sniperActive;
            const res = await fetch(`/api/toggle_sniper?active=${sniperActive}`);
            const data = await res.json();
            
            const btn = document.getElementById('btnSniper');
            if (sniperActive) {
                btn.innerText = "🔴 Desactivar Sniper";
                btn.classList.add('active');
            } else {
                btn.innerText = "🎯 Modo Sniper Oro (HFT)";
                btn.classList.remove('active');
            }
        }

        // Intervalo de actualización: cada 2 segundos para la UI
        setInterval(updateStatus, 2000);
    </script>
</body>
</html>
